# The kernel lab of netdiag (ND-7, step 3). Each case makes one network fault with real kernels in Docker, through the
# harness of systems: a client, one router `gw`, the target, a reference host and a DNS resolver. The agent of the
# lab visits the target from the client. The lab diagnoses each case and scores the diagnosis against the true fault.
#
# The command is packages/lab/src/kernel/main.ts. The job fails when a case gives no read, or when the recall of a
# class is below its bar in packages/lab/bars/kernel.json. The bars hold for 5 rounds, so a run with other rounds has
# no gate. A dispatch with 5 runs or more and `bars` true computes new bars (step 4). The job `where` starts the
# where cases of ND-15 in their own worlds, with the bars in packages/lab/bars/where.json. The job `e4` starts the
# same command in the guest of a VM, layer E4 (ND-17, step 5).
name: Lab (kernel)

on:
  push:
    branches: [main]
  # No path filter: a summary job of a pull request runs on each pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      rounds:
        description: The number of rounds. Each round starts a new world and operates each case once.
        required: false
        default: "5"
      runs:
        description: The runs, as a JSON list of numbers, for example [1,2,3,4,5]. Each run is one job on its own runner.
        required: false
        default: "[1]"
      bars:
        description: Compute the bars of the gate from the scores of the runs. This needs 5 runs or more.
        type: boolean
        required: false
        default: false
      e4:
        description: Also start the kernel lab in the guest of a VM, layer E4. Each run of the list is one guest.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: lab-kernel-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lab:
    name: Kernel lab
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROUNDS: ${{ inputs.rounds || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner, beside the records
        run: |
          mkdir -p lab-kernel-out
          {
            echo "kernel: $(uname -r)"
            echo "docker: $(docker version --format '{{.Server.Version}}')"
            echo "cpus: $(nproc)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MiB"
            echo "image: $ImageOS $ImageVersion"
          } | tee lab-kernel-out/runner.txt
      - name: Start the kernel lab
        run: |
          bars=()
          if [ "$ROUNDS" = 5 ]; then bars=(--bars packages/lab/bars/kernel.json); fi
          node packages/lab/src/kernel/main.ts --rounds "$ROUNDS" --out lab-kernel-out "${bars[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-kernel-${{ github.sha }}-${{ matrix.run }}
          path: lab-kernel-out/
          if-no-files-found: error
          retention-days: 30

  # The where cases (ND-15): a loss on one link of the path, and the part of the path that lossStart of netdiag gives.
  # The command is packages/lab/src/kernel/where-main.ts. The job fails for a run with no read, and for a hit rate
  # below its bar. The bars hold for 5 rounds. Until a dispatch gives the file of the bars, the job has no gate.
  where:
    name: Kernel lab, where the loss starts
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ROUNDS: ${{ inputs.rounds || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The runner, beside the records
        run: |
          mkdir -p lab-where-out
          {
            echo "kernel: $(uname -r)"
            echo "docker: $(docker version --format '{{.Server.Version}}')"
            echo "cpus: $(nproc)"
            echo "memory: $(free -m | awk '/^Mem:/ {print $2}') MiB"
            echo "image: $ImageOS $ImageVersion"
          } | tee lab-where-out/runner.txt
      - name: Start the where cases
        run: |
          bars=()
          if [ "$ROUNDS" = 5 ] && [ -f packages/lab/bars/where.json ]; then bars=(--bars packages/lab/bars/where.json); fi
          node packages/lab/src/kernel/where-main.ts --rounds "$ROUNDS" --out lab-where-out "${bars[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-where-${{ github.sha }}-${{ matrix.run }}
          path: lab-where-out/
          if-no-files-found: error
          retention-days: 30

  # The kernel lab on layer E4 (ND-17, step 5): the command of the job `lab`, in the guest of a VM with its own kernel.
  # The workflow vm-run.yml of systems (SYS-136) makes the guest. The commit of the uses line is also the input
  # harness. The guest installs this checkout from its lockfile. A runner with no KVM gives a void run with no record.
  # E4 has no bars yet, so the job is not in the check `Kernel lab OK`. It starts on a push to main and on a dispatch
  # with e4 true. A dispatch with 5 runs gives the bars of E4. Then the job goes into the check of each pull request.
  e4:
    name: Kernel lab in a VM guest (E4)
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.e4) }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    uses: mark1russell7/systems/.github/workflows/vm-run.yml@e4302422d5f6d4d4cdc7e771cda587f52ce0a195 # harness 0.16.19
    with:
      harness: e4302422d5f6d4d4cdc7e771cda587f52ce0a195
      argv: ${{ format('["node", "packages/lab/src/kernel/main.ts", "--rounds", "{0}", "--out", "/out/lab"]', fromJSON(inputs.rounds || '5')) }}
      limit: 120
      artifact: lab-e4-${{ github.sha }}-${{ matrix.run }}

  # The read of the E4 runs. Each guest writes run.json: why the run ended, its exit code and the kernel of the guest.
  # A run with no record has no read, and a missing read is not a pass. Thus the job fails on a void run.
  e4-read:
    name: Read of the E4 runs
    needs: [e4]
    if: ${{ !cancelled() && needs.e4.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-e4-${{ github.sha }}-*
          path: e4-runs
      - name: The end of each guest
        run: |
          shopt -s nullglob
          folders=(e4-runs/*/)
          if [ ${#folders[@]} -eq 0 ]; then echo "::error::no artifact of an E4 run"; exit 1; fi
          {
            echo "## The kernel lab on layer E4"
            echo
            echo "| Run | Guest | Ended | Status | Kernel | Install (s) | Lab (s) |"
            echo "| --- | --- | --- | --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          for folder in "${folders[@]}"; do
            run="$(basename "$folder")"
            record="${folder}out/run.json"
            if [ ! -f "$record" ]; then
              why="$(grep -h '^void' "${folder}runner.txt" 2>/dev/null || echo 'the guest gave no record')"
              echo "| $run | no read: $why | - | - | - | - | - |" >> "$GITHUB_STEP_SUMMARY"
              echo "::error::$run: no read, because $why"
              bad=1
              continue
            fi
            jq -r --arg run "$run" '"| \($run) | yes | \(.ended) | \(.status) | \(.kernel) | \(.installMs / 1000 | floor) | \(.ms / 1000 | floor) |"' "$record" >> "$GITHUB_STEP_SUMMARY"
            if [ "$(jq -r .ended "$record")" != exit ] || [ "$(jq -r .status "$record")" != 0 ]; then
              echo "::error::$run: the lab ended with $(jq -r .ended "$record"), status $(jq -r .status "$record")"
              bad=1
            fi
          done
          for summary in e4-runs/*/out/lab/summary.md; do
            { echo; echo "### $(basename "$(dirname "$(dirname "$(dirname "$summary")")")")"; echo; cat "$summary"; } >> "$GITHUB_STEP_SUMMARY"
          done
          exit $bad

  # The bars of the gate (ND-7, step 4): the least lower end of the recall of each hypothesis over the runs, minus the
  # spread of these lower ends. A dispatch with runs [1,2,3,4,5] and bars true gives them. A pull request commits them.
  # The job gives the bars of the kernel lab and of the where cases, each from the runs of its own job.
  bars:
    name: Bars of the gate
    needs: [lab, where]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.bars }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-kernel-${{ github.sha }}-*
          path: runs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-where-${{ github.sha }}-*
          path: where-runs
      - name: Compute the bars
        run: node packages/lab/src/bars-main.ts --out bars-out/kernel.json runs/* | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compute the bars of the where cases
        if: ${{ !cancelled() }}
        run: node packages/lab/src/bars-main.ts --title "The bars of the where cases" --out bars-out/where.json where-runs/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: lab-kernel-bars-${{ github.sha }}
          path: bars-out/
          if-no-files-found: error
          retention-days: 90

  # The summary check of this lab for the ruleset of main (CI.md of the template, "The check of the ruleset"). It
  # passes only when each lab job passed. The job bars starts only on a dispatch, so ALLOW_SKIP names it.
  kernel-lab-ok:
    name: Kernel lab OK
    if: ${{ !cancelled() }}
    needs: [lab, where, bars]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "bars"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
