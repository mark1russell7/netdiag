# The loopback lab of netdiag (ND-7, step 2). Each case makes one network fault with real servers on lab addresses.
# The lab diagnoses each case and scores the diagnosis against the true fault.
#
# The lab addresses are on the interface lo: 203.0.113.0/24 (a documentation range) stands for hosts on the internet,
# and 192.168.250.80 is the captive portal. netem adds 10 ms to each packet on lo, so the times have the ratios of
# a real path. The job fails when a case gives no read, or when the recall of a class is below its bar in
# packages/lab/bars/loopback.json. The bars hold for 5 rounds, so a run with other rounds has no gate. A dispatch with
# 5 runs or more and `bars` true computes new bars (step 4).
name: Lab

on:
  push:
    branches: [main]
  # No path filter: a summary job of a pull request runs on each pull request.
  pull_request:
  workflow_dispatch:
    inputs:
      rounds:
        description: The number of rounds. Each round runs each case once.
        required: false
        default: "5"
      runs:
        description: The runs, as a JSON list of numbers, for example [1,2,3,4,5]. Each run is one job on its own runner.
        required: false
        default: "[1]"
      bars:
        description: Compute the bars of the gate from the scores of the runs. This needs 5 runs or more.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: lab-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lab:
    name: Loopback lab
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ROUNDS: ${{ inputs.rounds || '5' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add the lab addresses and the delay of the path
        run: |
          for address in 203.0.113.10 203.0.113.20 203.0.113.53 192.168.250.80; do
            sudo ip addr add "$address/32" dev lo
          done
          sudo tc qdisc add dev lo root netem delay 10ms
          ip -brief addr show dev lo
          tc qdisc show dev lo
      - name: Run the lab
        run: |
          bars=()
          if [ "$ROUNDS" = 5 ]; then bars=(--bars packages/lab/bars/loopback.json); fi
          node packages/lab/src/main.ts --hosts ci --rounds "$ROUNDS" --out lab-out "${bars[@]}"
      - name: Remove the delay of the path
        if: always()
        run: sudo tc qdisc del dev lo root || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lab-${{ github.sha }}-${{ matrix.run }}
          path: lab-out/
          if-no-files-found: error
          retention-days: 30

  # The bars of the gate (ND-7, step 4): the least lower end of the recall of each hypothesis over the runs, minus the
  # spread of these lower ends. A dispatch with runs [1,2,3,4,5] and bars true gives them. A pull request commits them.
  bars:
    name: Bars of the gate
    needs: lab
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.bars }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-${{ github.sha }}-*
          path: runs
      - name: Compute the bars
        run: node packages/lab/src/bars-main.ts --out bars-out/loopback.json runs/* | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-bars-${{ github.sha }}
          path: bars-out/
          if-no-files-found: error
          retention-days: 90

  # The summary check of this lab for the ruleset of main (CI.md of the template, "The check of the ruleset"). It
  # passes only when each lab job passed. The job bars starts only on a dispatch, so ALLOW_SKIP names it.
  lab-ok:
    name: Lab OK
    if: ${{ !cancelled() }}
    needs: [lab, bars]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: "bars"
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
